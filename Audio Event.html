<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <title>Audio Event</title>

  <style>
    body {
      font-family: "Vazirmatn", sans-serif;
      background: black;
      display: flex;
      justify-content: center;
      direction: rtl;
    }

    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 15px;
      width: 480px;
    }

    audio {
      width: 100%;
      margin-bottom: 15px;
    }

    .info-box {
      background: #f9fafb;
      padding: 10px 15px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      margin-top: 10px;
      font-size: 15px;
    }

    .label {
      font-weight: bold;
      color: #374151;
    }

    .value {
      color: #111827;
    }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="card">

    <audio id="aud" controls 
      src="https://dls.musics-fa.com/song/alibz/dlswm/Morteza%20Pashaei%20-%20Asheghetam%20(320).mp3"></audio>

    <div class="info-box">
      <div>
        <span class="label">رویداد: </span>
        <span id="ev" class="value">—</span>
      </div>
      <div>
        <span class="label">ثانیه: </span><span id="sec" class="value">0</span>
      </div>
      <div>
        <span class="label">دقیقه:ثانیه: </span><span id="minsec" class="value">0:00</span>
      </div>
    </div>
  </div>

  <script>
    var a = document.getElementById("aud");
    var ev = document.getElementById("ev");
    var sec = document.getElementById("sec");
    var minsec = document.getElementById("minsec");

    function format(t) {
      var m = Math.floor(t / 60);
      var s = Math.floor(t % 60)
        .toString()
        .padStart(2, "0");
      return m + ":" + s;
    }

    a.onplay = function () {
      ev.textContent = "درحال پخش";
    };

    a.onpause = function () {
      ev.textContent = "مکث";
    };

    a.onended = function () {
      ev.textContent = "اتمام";
    };

    a.ontimeupdate = function () {
      sec.textContent = Math.floor(a.currentTime);
      minsec.textContent = format(a.currentTime);
    };

    a.onvolumechange = function () {
      ev.textContent = "تغییر حجم صدا";
    };
  </script>
</body>

</html>
