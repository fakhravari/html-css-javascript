<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>WaveformPlayer Example</title>
    <!-- CSS WaveformPlayer -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/@arraypress/waveform-player@latest/dist/waveform-player.css"
    />
  </head>
  <body>
    <!-- پلاگین WaveformPlayer -->
    <div
      data-waveform-player
      data-url="https://dls.musics-fa.com/song/alibz/dlswm/Morteza%20Pashaei%20-%20Asheghetam%20(320).mp3"
      data-title="Morteza Pashaei - Asheghetam"
      data-waveform-style="mirror"
      style="max-width: 600px; margin: auto; padding: 40px 0"
    ></div>

    <!-- JS WaveformPlayer -->
    <script src="https://unpkg.com/@arraypress/waveform-player@latest/dist/waveform-player.min.js"></script>
  </body>
</html>
